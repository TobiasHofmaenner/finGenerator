[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fingen"
version = "0.2.0"
description = "Parametric surfboard fin geometry generator: rider data in, 3D-printable fin set out"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Tobias Hofmänner" }]
keywords = ["surfboard", "fin", "parametric", "cad", "hydrodynamics", "3d-printing"]
dependencies = [
    "build123d>=0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "matplotlib>=3.8",
    "pytest-xdist>=3.5",
]

[project.scripts]
fingen = "fingen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fingen"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# OpenFOAM dictionary templates legitimately carry long literal lines.
"src/fingen/cfd/case.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--dist loadgroup"
markers = [
    "heavy: OCCT-heavy property sweeps; run locally, excluded from GitHub CI",
]
